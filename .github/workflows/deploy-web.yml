name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Portfolio Source
        uses: actions/checkout@v4
        with:
          repository: 'm1st4ck/_m1st4ck-portfolio-source-code'
          ssh-key: ${{ secrets.ROOT_SSH_KEY }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build and Minify Site Assets
        run: |
          mkdir -p dist
          
          cp -r audio css images js journeys index.html dist/
          
          npm init -y
          npm install terser clean-css-cli html-minifier-terser
          
          echo "Minifying JS..."
          find dist -type f -name "*.js" | while read -r f; do
            npx terser "$f" -o "$f" --compress --mangle
          done
          
          echo "Minifying CSS..."
          find dist -type f -name "*.css" | while read -r f; do
            npx cleancss -o "$f" "$f"
          done
          
          echo "Minifying HTML..."
          find dist -type f -name "*.html" | while read -r f; do
            npx html-minifier-terser \
              --collapse-whitespace \
              --remove-comments \
              --minify-js true \
              --minify-css true \
              "$f" -o "$f"
          done

      - name: Setup SSH Deploy Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.ROOT_SSH_KEY }}

      - name: Trust GitHub Host Fingerprint
        run: ssh-keyscan -H github.com >> ~/.ssh/known_hosts

      - name: Clone Package Build Sources
        run: git clone git@github.com:m1st4ck/m1st4ck-pkgbuilds.git

      - name: Build Packages
        run: |
          mkdir -p m1st4ck-repository
          docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace archlinux:base-devel bash -c "
            pacman -Syu --noconfirm base-devel sudo git &&
            useradd -m builder &&
            echo 'builder ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers &&
            chown -R builder:builder /workspace/m1st4ck-pkgbuilds /workspace/m1st4ck-repository &&
            cd /workspace/m1st4ck-pkgbuilds &&
            for pkg in */; do
              pkgname=\${pkg%/}
              if [ -f \"\$pkgname/PKGBUILD\" ]; then
                cd \"\$pkgname\"
                su builder -c 'makepkg -s --noconfirm --skippgpcheck'
                find . -maxdepth 1 -name '*.pkg.tar.zst' -exec cp {} /workspace/m1st4ck-repository/ \;
                cd ..
              fi
            done
          "

      - name: Fix Build Permissions
        run: sudo chown -R $(id -u):$(id -g) m1st4ck-repository m1st4ck-pkgbuilds

      - name: Generate Repository Index
        run: |
          docker run --rm -v ${{ github.workspace }}/m1st4ck-repository:/repo -w /repo archlinux:base-devel bash -c "
            pacman -Syu --noconfirm pacman-contrib &&
            repo-add m1st4ck.db.tar.gz *.pkg.tar.zst
          "

      - name: Fix Repository Permissions
        run: sudo chown -R $(id -u):$(id -g) m1st4ck-repository m1st4ck-pkgbuilds

      - name: Merge Packages into Site
        run: cp -r m1st4ck-repository/* dist/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
